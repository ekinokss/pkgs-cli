name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run deterministic tests
        shell: pwsh
        run: ./tests/run-tests.ps1 -SkipIntegration
